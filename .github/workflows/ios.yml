name: Blockys iOS build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag that receives the assets (empty skips publishing)'
        required: false
        default: 'blockys-ios-v2.0.7'
  push:
    tags:
      - 'blockys-ios-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch LWJGL 3.4.1 and MobileGlues
        run: |
          set -eu
          cd Natives/external/MobileGlues
          git fetch --depth=1 https://github.com/ryanmurf/MobileGlues d4ba2dfb3de181a63d27c93a94be6bf74e11fc6c
          git checkout --detach d4ba2dfb3de181a63d27c93a94be6bf74e11fc6c
          # That commit moved the sources to MobileGlues-cpp/; the submodule pins
          # from the umbrella checkout still use the old src/main/cpp/ layout, so
          # the new 3rdparty gitlinks must be initialized or cmake fails.
          git submodule sync --recursive
          git submodule update --init --recursive -- \
            MobileGlues-cpp/3rdparty/glslang \
            MobileGlues-cpp/3rdparty/SPIRV-Cross \
            MobileGlues-cpp/3rdparty/glm \
            MobileGlues-cpp/3rdparty/xxhash \
            MobileGlues-cpp/include/FastSTL
          cd "$GITHUB_WORKSPACE"
          mkdir -p JavaApp/libs/lwjgl-3.3.3 JavaApp/libs/lwjgl-3.4.1
          mkdir -p Natives/resources/Frameworks/lwjgl33 Natives/resources/Frameworks/lwjgl34
          cp JavaApp/libs/lwjgl/*.jar JavaApp/libs/lwjgl-3.3.3/
          cp Natives/resources/Frameworks/liblwjgl*.dylib Natives/resources/Frameworks/libfreetype.dylib Natives/resources/Frameworks/lwjgl33/
          base=https://raw.githubusercontent.com/ryanmurf/Amethyst-iOS/67f7537f892a4966df3fb289e68f0bac461dbdec
          for f in lwjgl.jar lwjgl-freetype.jar lwjgl-glfw.jar lwjgl-nanovg.jar lwjgl-openal.jar lwjgl-opengl.jar lwjgl-shaderc.jar lwjgl-spvc.jar lwjgl-stb.jar lwjgl-tinyfd.jar lwjgl-vma.jar lwjgl-vulkan.jar; do
            curl -fsSL "$base/JavaApp/libs/lwjgl-3.4.1/$f" -o "JavaApp/libs/lwjgl-3.4.1/$f"
          done
          for f in libfreetype.dylib liblwjgl.dylib liblwjgl_nanovg.dylib liblwjgl_opengl.dylib liblwjgl_stb.dylib liblwjgl_tinyfd.dylib liblwjgl_vma.dylib libspirv-cross.dylib; do
            curl -fsSL "$base/Natives/resources/Frameworks/lwjgl34/$f" -o "Natives/resources/Frameworks/lwjgl34/$f"
          done
          ls -l JavaApp/libs/lwjgl-3.4.1 Natives/resources/Frameworks/lwjgl34

      - name: Install tools
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Check toolchain
        run: |
          xcodebuild -version
          gmake --version | head -1
          ldid -v || true
          cmake --version | head -1
          "$JAVA_HOME/bin/javac" -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build packages
        env:
          RUNNER: 0
        run: |
          export BOOTJDK="$JAVA_HOME/bin"
          gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2
          gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Rename artifacts
        run: |
          cd artifacts
          ls -lh
          mv org.angelauramc.amethyst-2.0.7-ios.ipa Blockys-iOS-2.0.7.ipa
          mv org.angelauramc.amethyst-2.0.7-ios-trollstore.tipa Blockys-iOS-2.0.7-trollstore.tipa
          shasum -a 256 Blockys-iOS-2.0.7.ipa Blockys-iOS-2.0.7-trollstore.tipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blockys-iOS
          path: |
            artifacts/Blockys-iOS-2.0.7.ipa
            artifacts/Blockys-iOS-2.0.7-trollstore.tipa
            artifacts/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          RELEASE_NOTES: |
            ## Blockys iOS 2.0.7

            - Version numbering now matches Blockys Mobile 2.0.7. The Mobile 2.0.7 repair is Android-only code: it hooks SDL to retry the EGL load and to reuse the single window Android allows when the game falls back to OpenGL. Blockys iOS does not ship SDL, so there is nothing to port from that fix.
            - Everything that repair builds on was already in Blockys iOS 1.0.3: Minecraft 26.3 and 26.4-snapshot (Java 25) launch with LWJGL 3.4.1, the launcher installs Java 25 when a version asks for it, and the game options keep fullscreen off so the window fits the device.
            - Local (offline) accounts keep working: create a profile, install Minecraft and play without a Microsoft account.
            - Blockys-iOS-2.0.7.ipa is unsigned and installs with TrollStore, AltStore, SideStore or StikDebug. Blockys-iOS-2.0.7-trollstore.tipa adds the TrollStore JIT entitlement.
Based on Amethyst-iOS (GPL-3.0). Not affiliated with AngelAuraMC, PojavLauncher or Mojang.
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo 'No release tag configured, skipping publication.'
            exit 0
          fi
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/Blockys-iOS-2.0.7.ipa artifacts/Blockys-iOS-2.0.7-trollstore.tipa artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              artifacts/Blockys-iOS-2.0.7.ipa \
              artifacts/Blockys-iOS-2.0.7-trollstore.tipa \
              artifacts/SHA256SUMS.txt \
              --title "Blockys iOS 2.0.7" \
              --notes-file release-notes.md
          fi
