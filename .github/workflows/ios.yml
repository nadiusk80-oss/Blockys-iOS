name: Blockys iOS build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag that receives the assets (empty skips publishing)'
        required: false
        default: 'blockys-ios-v1.0.1'
  push:
    tags:
      - 'blockys-ios-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Check toolchain
        run: |
          xcodebuild -version
          gmake --version | head -1
          ldid -v || true
          cmake --version | head -1
          "$JAVA_HOME/bin/javac" -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build packages
        env:
          RUNNER: 0
        run: |
          export BOOTJDK="$JAVA_HOME/bin"
          gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2
          gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Rename artifacts
        run: |
          cd artifacts
          ls -lh
          mv org.angelauramc.amethyst-1.0.1-ios.ipa Blockys-iOS-1.0.1.ipa
          mv org.angelauramc.amethyst-1.0.1-ios-trollstore.tipa Blockys-iOS-1.0.1-trollstore.tipa
          shasum -a 256 Blockys-iOS-1.0.1.ipa Blockys-iOS-1.0.1-trollstore.tipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blockys-iOS
          path: |
            artifacts/Blockys-iOS-1.0.1.ipa
            artifacts/Blockys-iOS-1.0.1-trollstore.tipa
            artifacts/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo 'No release tag configured, skipping publication.'
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/Blockys-iOS-1.0.1.ipa artifacts/Blockys-iOS-1.0.1-trollstore.tipa artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              artifacts/Blockys-iOS-1.0.1.ipa \
              artifacts/Blockys-iOS-1.0.1-trollstore.tipa \
              artifacts/SHA256SUMS.txt \
              --title "Blockys iOS 1.0.1" \
              --notes "Blockys for iPhone and iPad, based on Amethyst-iOS (GPL-3.0). Blockys-iOS-1.0.1.ipa is unsigned and installs with TrollStore, AltStore, SideStore or StikDebug. Blockys-iOS-1.0.1-trollstore.tipa adds the TrollStore JIT entitlement."
          fi
